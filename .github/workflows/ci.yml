name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[sequence]' onnxruntime
      - run: python -m unittest discover -s test/training -v
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:browser
        env:
          POSTHOG_SDK: posthog-js-current
      - uses: actions/upload-artifact@v4
        with:
          name: orion-script
          path: dist/
