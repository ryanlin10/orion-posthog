[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paradigm-orion"
version = "0.4.0"
description = "Orion: input telemetry on PostHog, sentiment classifiers trained from it, and live labels for agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pyyaml>=6", "scikit-learn==1.9.1"]

[project.optional-dependencies]
sequence = ["torch>=2.5", "onnx>=1.17"]

[project.scripts]
orion = "paradigm_orion.cli:main"
orion-dataset = "paradigm_orion.dataset.__main__:main"

[tool.setuptools.packages.find]
include = ["paradigm_orion*"]

[tool.setuptools.package-data]
paradigm_orion = ["labellers/*.html", "setup.html"]
