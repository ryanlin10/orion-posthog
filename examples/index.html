<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PostHog behavioral recorder playground</title>
<style>body{font:17px system-ui;max-width:960px;margin:48px auto;padding:0 20px;background:#f5f5f2;color:#152924}h1{font-size:40px}input,button,textarea{font:inherit;padding:12px;margin:8px 0;border:1px solid #83958c;border-radius:6px}label{display:block}#pad{height:190px;background:#dbe9df;touch-action:none;border-radius:12px;padding:20px}pre{background:#162d26;color:#d7f6e5;padding:20px;overflow:auto;max-height:380px}small{display:block}canvas{max-width:100%}</style>
<h1>Every real input sample.</h1>
<p>This playground stores bursts in this tab only. Nothing is sent to PostHog. Move, click, hold keys, and compare the captured timestamps.</p>
<div id="pad">Pointer test area — move and press here.</div>
<label>Test typing <input id="typing" placeholder="Use non-sensitive test text"></label>
<label>Excluded password <input id="secret" type="password"></label>
<button id="flush">Flush</button> <button id="download">Download local JSON</button>
<small id="status"></small><pre id="output">Waiting for input…</pre>
<script type="module">
import { createRecorder } from '../src/index.js';
import { analyzeBatches } from '../src/analysis.js';
window.batches = [];
window.mockPosthog = { capture(name, properties) { batches.push(properties); render(); }, get_session_id: () => 'local-demo', get_distinct_id: () => 'local-demo', has_opted_out_capturing: () => false };
window.recorder = createRecorder(mockPosthog);
function render() { document.querySelector('#output').textContent = JSON.stringify(analyzeBatches(batches), null, 2); document.querySelector('#status').textContent = `${batches.length} local batches · ${recorder.getStats().movementSource} · physical key codes, no typed text`; }
document.querySelector('#flush').onclick = () => recorder.flush();
document.querySelector('#download').onclick = () => { recorder.flush(); const a = document.createElement('a'); const url = URL.createObjectURL(new Blob([JSON.stringify(batches, null, 2)], { type: 'application/json' })); a.href = url; a.download = 'behavioral-bursts.json'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); };
</script></html>
